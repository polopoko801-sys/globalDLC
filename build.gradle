plugins {
	id 'fabric-loom' version '1.16.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/gombal.accesswidener")
}

repositories {
	maven {
		name = "jitpack.io"
		url = "https://jitpack.io"
	}
	maven {
		name = 'swt-repo'
		url = "https://maven-eclipse.github.io/maven"
	}
	maven {
		name = "meteor-maven"
		url = "https://maven.meteordev.org/releases"
	}
	maven {
		name = "meteor-maven-snapshots"
		url = "https://maven.meteordev.org/snapshots"
	}
	maven {
		name = "modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}

	mavenCentral()
}

configurations {
	libImpl
	modImpl
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	libImpl("meteordevelopment:orbit:${project.orbit_version}")

	modCompileOnly "meteordevelopment:baritone:1.21-SNAPSHOT"

	libImpl("io.netty:netty-handler-proxy:${project.netty_version}") { transitive = false }
	libImpl("io.netty:netty-codec-socks:${project.netty_version}") { transitive = false }

	// In-Game Account Switcher (LGPL-3.0-or-later, by VidTu) shipped inside our jar as a nested mod,
	// unmodified, so the account switcher works without installing it separately.
	include "maven.modrinth:in-game-account-switcher:9.0.7+1.21.11-fabric"

	configurations.libImpl.dependencies.each {
		implementation(it)
	}

	configurations.modImpl.dependencies.each {
		modImplementation(it)
		include(it)
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xmaxerrs', '3000', '-Xmaxwarns', '50']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from {
		configurations.libImpl.collect { it.isDirectory() ? it : zipTree(it) }
	}
	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Built-By': System.getProperty('user.name'),
		)
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

// After every build the fresh client goes straight into the Modrinth profile ("Fabric 1.21.11"), replacing the
// copy that is there. The installed jar carries a licence stamped in by the desktop app (uid.txt and the app
// address) - those entries are carried over from it, so the new build keeps the same UID and stays activated.
// Skipped quietly when there is no such profile; -PnoInstall turns it off for one build.
tasks.register('installModrinth') {
	dependsOn remapJar
	onlyIf { !project.hasProperty('noInstall') }
	doLast {
		def mods = new File(System.getenv('APPDATA') ?: '', 'ModrinthApp/profiles/Fabric 1.21.11/mods')
		if (!mods.isDirectory()) {
			logger.lifecycle("installModrinth: no Modrinth profile at ${mods}, skipped")
			return
		}
		def built = remapJar.archiveFile.get().asFile
		def stamp = ['uid.txt', 'gombal_app_address.txt']
		def ours = (mods.listFiles() ?: []).findAll { it.name.startsWith('GlobalDLC') && it.name.endsWith('.jar') }

		// the licence of the installed copy - or, when none carries one, of the newest update the desktop app
		// stamped (Desktop/GlobalDLC-update-*/GlobalDLC-*.jar)
		Map<String, byte[]> kept = [:]
		def licensed = { File f -> new java.util.zip.ZipFile(f).withCloseable { z -> z.getEntry('uid.txt') != null } }
		def source = ours.find(licensed)
		def licenceFrom = source
		if (licenceFrom == null) {
			def desktop = new File(System.getProperty('user.home'), 'Desktop')
			licenceFrom = (desktop.listFiles() ?: [])
					.findAll { it.isDirectory() && it.name.startsWith('GlobalDLC-update-') }
					.collectMany { (it.listFiles() ?: []).findAll { j -> j.name.startsWith('GlobalDLC') && j.name.endsWith('.jar') } }
					.sort { -it.lastModified() }
					.find(licensed)
		}
		if (licenceFrom != null) {
			new java.util.zip.ZipFile(licenceFrom).withCloseable { z ->
				stamp.each { n -> def e = z.getEntry(n); if (e != null) kept[n] = z.getInputStream(e).bytes }
			}
		}

		def target = new File(mods, licenceFrom?.name ?: 'GlobalDLC.jar')
		def temp = new File(mods, target.name + '.tmp')
		new java.util.zip.ZipFile(built).withCloseable { z ->
			new java.util.zip.ZipOutputStream(new FileOutputStream(temp)).withCloseable { out ->
				z.entries().each { e ->
					if (e.name in stamp || e.name == 'uid_avatar.png') return
					out.putNextEntry(new java.util.zip.ZipEntry(e.name))
					if (!e.directory) z.getInputStream(e).withCloseable { it.transferTo(out) }
					out.closeEntry()
				}
				kept.each { n, bytes ->
					out.putNextEntry(new java.util.zip.ZipEntry(n))
					out.write(bytes)
					out.closeEntry()
				}
			}
		}

		// two copies of the mod in one folder is a duplicate mod id - every other copy of ours goes
		ours.findAll { it != target }.each { it.delete() }
		try {
			java.nio.file.Files.move(temp.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		} catch (Exception e) {
			temp.delete()
			throw new GradleException("installModrinth: cannot replace ${target.name} - close the game and build again (${e.message})")
		}
		logger.lifecycle("installModrinth: ${target.name} updated" + (kept.isEmpty() ? ' (no licence found to carry over)' : ' (licence kept)'))
	}
}
tasks.named('build') { finalizedBy 'installModrinth' }
