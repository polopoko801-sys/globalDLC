<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>g — liquid glass</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(85vmin 85vmin at 50% 40%, #2b1949 0%, #180c2a 45%, #0b0613 78%, #080410 100%);
  }
  svg { width: min(100vmin, 860px); height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- backlight of the scene -->
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%"   stop-color="#3a2260"/>
      <stop offset="45%"  stop-color="#1d1030"/>
      <stop offset="100%" stop-color="#0d0716"/>
    </radialGradient>

    <!-- glass face: bright lavender top-left -> deep violet bottom-right -->
    <linearGradient id="face" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="12%"  stop-color="#efe4ff"/>
      <stop offset="30%"  stop-color="#c9b0f8"/>
      <stop offset="52%"  stop-color="#8f6ae0"/>
      <stop offset="72%"  stop-color="#5b37b4"/>
      <stop offset="88%"  stop-color="#3a1a7d"/>
      <stop offset="100%" stop-color="#240c4d"/>
    </linearGradient>

    <!-- rim light along the edges -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#d8c3ff" stop-opacity="0.55"/>
      <stop offset="62%"  stop-color="#7b52d0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- one glass pane, going from bright to clear -->
    <linearGradient id="paneA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paneB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paneDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0a33" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0a33" stop-opacity="0.55"/>
    </linearGradient>

    <!-- the horizontal chrome band that sells the material -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="58%"  stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hot" cx="35%" cy="28%" r="45%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0.55 0 0 0 0.14  0 0.24 0 0 0.03  0 0 0.9 0 0.55  0 0 0 0.85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- bevel: the inner edge of the glass -->
    <filter id="bevel">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.1" specularExponent="22"
                          lighting-color="#ffffff" result="spec">
        <fePointLight x="-120" y="-160" z="260"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specIn"/>
      </feMerge>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>

    <!-- the glyph, used as a window to paint the glass into -->
    <text id="glyph" x="360" y="545" text-anchor="middle"
          font-family="'Segoe UI Black','Arial Black','Inter',system-ui,sans-serif"
          font-weight="900" font-size="560" letter-spacing="-8">g</text>
    <clipPath id="cut"><use href="#glyph"/></clipPath>
    <mask id="fadeMask">
      <use href="#glyph" fill="#fff"/>
    </mask>
  </defs>

  <!-- scene: the backdrop lives on the page, so the logo has no frame around it -->
  <ellipse cx="360" cy="330" rx="250" ry="230" fill="#7b4fe0" opacity="0.20" filter="url(#soft)"/>    <g transform="rotate(-6 360 360)">

    <!-- glow behind the letter -->
    <g filter="url(#glow)" opacity="0.55">
      <use href="#glyph" fill="#8a5cff"/>
    </g>

    <!-- depth: a stack of darker copies gives the glass thickness -->
    <g opacity="0.9">
      <use href="#glyph" x="10" y="12" fill="#1b0b33" filter="url(#tiny)"/>
      <use href="#glyph" x="7"  y="9"  fill="#2a1150"/>
      <use href="#glyph" x="4"  y="6"  fill="#3a1a70"/>
      <use href="#glyph" x="2"  y="3"  fill="#4b2290"/>
    </g>

    <!-- chromatic fringe -->
    <use href="#glyph" x="-4" y="-2" fill="#67e8ff" opacity="0.30" style="mix-blend-mode:screen"/>
    <use href="#glyph" x="4"  y="2"  fill="#ff6ad5" opacity="0.30" style="mix-blend-mode:screen"/>

    <!-- the glass itself -->
    <g clip-path="url(#cut)">
      <rect x="0" y="0" width="720" height="720" fill="url(#face)"/>

      <!-- panes / facets: big hard-edged shards, lit from the upper left -->
      <polygon points="120,160 470,120 420,320 190,330"  fill="#ffffff" opacity="0.62"/>
      <polygon points="120,160 190,330 96,470 40,280"    fill="#cbb4ff" opacity="0.30"/>
      <polygon points="190,330 420,320 470,545 250,640"  fill="url(#paneB)"/>
      <polygon points="470,120 600,150 520,330 420,320"  fill="url(#paneA)" opacity="0.55"/>
      <polygon points="420,320 520,330 610,540 470,545"  fill="url(#paneDark)"/>
      <polygon points="250,640 470,545 520,600 390,700"  fill="url(#paneDark)" opacity="0.85"/>
      <polygon points="190,330 250,640 210,520 150,430"  fill="#ffffff" opacity="0.10"/>

      <!-- bright pane edges, the crystal seams -->
      <g stroke="#ffffff" stroke-linecap="round">
        <path d="M120 160 L470 120" stroke-opacity="0.95" stroke-width="3.2"/>
        <path d="M470 120 L420 320" stroke-opacity="0.85" stroke-width="2.4"/>
        <path d="M420 320 L190 330" stroke-opacity="1"    stroke-width="3"/>
        <path d="M190 330 L120 160" stroke-opacity="0.70" stroke-width="1.8"/>
        <path d="M190 330 L150 430" stroke-opacity="0.55" stroke-width="1.6"/>
        <path d="M420 320 L600 150" stroke-opacity="0.75" stroke-width="2"/>
        <path d="M420 320 L520 330" stroke-opacity="0.45" stroke-width="1.4"/>
        <path d="M250 640 L470 545" stroke-opacity="0.8"  stroke-width="2.4"/>
        <path d="M470 545 L520 330" stroke-opacity="0.5"  stroke-width="1.6"/>
      </g>

      <!-- chrome band -->
      <rect x="0" y="280" width="720" height="170" fill="url(#chrome)" opacity="0.42"/>
      <rect x="0" y="480" width="720" height="90"  fill="#120726" opacity="0.35"/>

      <!-- hot spot + a hard specular streak on the bowl -->
      <ellipse cx="230" cy="215" rx="180" ry="130" fill="url(#hot)"/>
      <path d="M150 200 L430 150 L400 210 L160 250 Z" fill="#ffffff" opacity="0.28"/>

      <!-- glass grain -->
      <rect width="720" height="720" filter="url(#grain)" opacity="0.5"/>
    </g>

    <!-- rim light + specular along the contour -->
    <use href="#glyph" fill="none" stroke="url(#rim)" stroke-width="3.2" filter="url(#bevel)"/>
    <use href="#glyph" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.1"
         transform="translate(-1.2,-1.2)"/>
  </g>
</svg>
</body>
</html>
